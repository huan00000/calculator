```yaml
name: Build C++ Calculator

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            artifact_name: calculator-linux
            executable: calculator

          # Windows
          - os: windows-latest
            artifact_name: calculator-windows
            executable: calculator.exe

          # macOS
          - os: macos-latest
            artifact_name: calculator-macos
            executable: calculator

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Linux
      # =========================
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator

      - name: Test on Linux
        if: runner.os == 'Linux'
        run: |
          echo "10 + 20" | ./calculator
          echo "100 / 4" | ./calculator
          echo "7 * 8" | ./calculator

      # =========================
      # Windows
      # =========================
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator.exe

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "10 + 20" | .\calculator.exe
          "100 / 4" | .\calculator.exe
          "7 * 8" | .\calculator.exe

      # =========================
      # macOS
      # =========================
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator

      - name: Test on macOS
        if: runner.os == 'macOS'
        run: |
          echo "10 + 20" | ./calculator
          echo "100 / 4" | ./calculator
          echo "7 * 8" | ./calculator

      # =========================
      # Upload build artifacts
      # =========================
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

  # =============================
  # Create GitHub Release
  # Only runs when pushing v* tag
  # =============================
  release:
    name: Create Release
    needs: build

    # 只有 v1.0.0 / v1.1.0 之类的 tag 才发布 Release
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded files
        run: |
          find artifacts -type f

      # 给 Linux/macOS 文件重新命名，避免同名
      - name: Prepare release files
        run: |
          mkdir release

          cp artifacts/calculator-windows/calculator.exe \
             release/calculator-windows.exe

          cp artifacts/calculator-linux/calculator \
             release/calculator-linux

          cp artifacts/calculator-macos/calculator \
             release/calculator-macos

          chmod +x release/calculator-linux
          chmod +x release/calculator-macos

          ls -lh release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/calculator-windows.exe
            release/calculator-linux
            release/calculator-macos
          generate_release_notes: true
```
