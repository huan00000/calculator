name: Build C++ Calculator

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: calculator-linux
            executable: calculator

          - os: windows-latest
            artifact_name: calculator-windows
            executable: calculator.exe

          - os: macos-latest
            artifact_name: calculator-macos
            executable: calculator

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator

      - name: Test on Linux
        if: runner.os == 'Linux'
        run: |
          echo "10 + 20" | ./calculator
          echo "100 / 4" | ./calculator
          echo "7 * 8" | ./calculator

      # Windows
      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator.exe

      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "10 + 20" | .\calculator.exe
          "100 / 4" | .\calculator.exe
          "7 * 8" | .\calculator.exe

      # macOS
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++17 -Wall -Wextra -Wpedantic -O2 calculator.cpp -o calculator

      - name: Test on macOS
        if: runner.os == 'macOS'
        run: |
          echo "10 + 20" | ./calculator
          echo "100 / 4" | ./calculator
          echo "7 * 8" | ./calculator

      # Upload
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.executable }}
          if-no-files-found: error